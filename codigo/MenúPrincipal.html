<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facundo: Camino de la Barbarie</title>

    <link rel="stylesheet" href="MenúPrincipal.css">
</head>


<body>

    <main class="game-menu">


        <!-- =========================================
             FONDO
        ========================================== -->

        <div class="background"></div>

        <div class="vignette"></div>



        <!-- =========================================
             BARRA SUPERIOR
        ========================================== -->

        <header class="topbar">

            <div class="topbar-left">

                <!-- Botón inicio -->
                <button
                    class="icon-button"
                    type="button"
                    data-action="home"
                    aria-label="Inicio"
                >
                    <span class="pixel-home"></span>
                </button>


                <!-- Botón configuración -->
                <button
                    class="icon-button"
                    type="button"
                    data-action="settings"
                    aria-label="Configuración"
                >
                    <span class="pixel-gear">⚙</span>
                </button>

            </div>



            <div class="topbar-right">

                <!-- Botón perfil -->
                <button
                    class="icon-button"
                    type="button"
                    data-action="profile"
                    aria-label="Perfil"
                >
                    <span class="pixel-user"></span>
                </button>


                <!-- Botón cerrar -->
                <button
                    class="icon-button close-button"
                    type="button"
                    data-action="close"
                    aria-label="Cerrar"
                >
                    ×
                </button>

            </div>

        </header>



        <!-- =========================================
             TÍTULO
        ========================================== -->

        <section class="title-block">

            <h1>

                <span>FACUNDO:</span>

                <span>CAMINO DE LA</span>

                <span>BARBARIE</span>

            </h1>

        </section>



        <!-- =========================================
             RETRATO DE FACUNDO QUIROGA
        ========================================== -->

        <figure class="portrait portrait-facundo">

            <div class="portrait-frame">

                <img
                    src="../Recursos Graficos/botones-El facundo juego/Retrato de Facundo.png"
                    alt="Retrato de Facundo Quiroga"
                >

            </div>


            <figcaption>

                <span>RETRATO DE</span>

                <span>FACUNDO QUIROGA</span>

                <small>(BANDO FEDERAL)</small>

            </figcaption>

        </figure>



        <!-- =========================================
             RETRATO DE SARMIENTO
        ========================================== -->

        <figure class="portrait portrait-sarmiento">

            <div class="portrait-frame">

                <img
                    src="../Recursos Graficos/botones-El facundo juego/Retrato de Sarmiento.png"
                    alt="Retrato de D.F. Sarmiento"
                >

            </div>


            <figcaption>

                <span>RETRATO DE</span>

                <span>D.F. SARMIENTO</span>

                <small>(BANDO UNITARIO)</small>

            </figcaption>

        </figure>



        <!-- =========================================
             MENÚ PRINCIPAL
        ========================================== -->

        <nav
            class="main-actions"
            aria-label="Menú principal"
        >

            <!-- Comenzar -->
            <button
                class="menu-button primary"
                type="button"
                data-action="start"
            >
                COMENZAR CAMINO
            </button>


            <!-- Retomar -->
            <button
                class="menu-button"
                type="button"
                data-action="resume"
            >
                RETOMAR CAMINO
            </button>


            <!-- Créditos -->
            <button
                class="menu-button"
                type="button"
                data-action="credits"
            >
                CRÉDITOS
            </button>

        </nav>



        <!-- =========================================
             VENTANA MODAL
        ========================================== -->

        <div
            class="modal-layer"
            id="modal-layer"
            aria-hidden="true"
        >

            <section
                class="modal"
                role="dialog"
                aria-modal="true"
            >

                <button
                    class="modal-close"
                    type="button"
                    data-action="modal-close"
                    aria-label="Cerrar"
                >
                    ×
                </button>


                <h2 id="modal-title">
                    FACUNDO
                </h2>


                <p id="modal-text"></p>


                <button
                    class="menu-button modal-ok"
                    type="button"
                    data-action="modal-close"
                >
                    ACEPTAR
                </button>

            </section>

        </div>



        <!-- =========================================
             MENSAJE INFERIOR
        ========================================== -->

        <div
            class="screen-message"
            id="screen-message"
            aria-live="polite"
        ></div>

    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        const modalLayer =
            document.getElementById("modal-layer");


        const modalTitle =
            document.getElementById("modal-title");


        const modalText =
            document.getElementById("modal-text");


        const message =
            document.getElementById("screen-message");



        /* =========================================
           ABRIR MODAL
        ========================================== */

        function openModal(title, text) {

            modalTitle.textContent = title;

            modalText.textContent = text;

            modalLayer.classList.add("is-open");

            modalLayer.setAttribute(
                "aria-hidden",
                "false"
            );

        }



        /* =========================================
           CERRAR MODAL
        ========================================== */

        function closeModal() {

            modalLayer.classList.remove(
                "is-open"
            );

            modalLayer.setAttribute(
                "aria-hidden",
                "true"
            );

        }



        /* =========================================
           MOSTRAR MENSAJE
        ========================================== */

        function showMessage(text) {

            message.textContent = text;

            message.classList.add("show");

            clearTimeout(
                window.messageTimer
            );


            window.messageTimer =
                setTimeout(() => {

                    message.classList.remove(
                        "show"
                    );

                }, 2200);

        }



        /* =========================================
           BOTONES
        ========================================== */

        document
            .querySelectorAll("[data-action]")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const action =
                            button.dataset.action;



                        switch (action) {


                            /* -------------------------
                               COMENZAR
                            -------------------------- */

                            case "start":

                                showMessage(
                                    "Preparando un nuevo camino..."
                                );

                                break;



                            /* -------------------------
                               RETOMAR
                            -------------------------- */

                            case "resume":

                                showMessage(
                                    "No hay una partida guardada todavía."
                                );

                                break;



                            /* -------------------------
                               CRÉDITOS
                            -------------------------- */

                            case "credits":

                                openModal(
                                    "CRÉDITOS",
                                    "Facundo: Camino de la Barbarie · Proyecto educativo de videojuego histórico."
                                );

                                break;



                            /* -------------------------
                               CONFIGURACIÓN
                            -------------------------- */

                            case "settings":

                                openModal(
                                    "CONFIGURACIÓN",
                                    "La configuración estará disponible próximamente."
                                );

                                break;



                            /* -------------------------
                               PERFIL
                            -------------------------- */

                            case "profile":

                                openModal(
                                    "PERFIL",
                                    "Perfil del jugador. Esta sección estará disponible próximamente."
                                );

                                break;



                            /* -------------------------
                               INICIO
                            -------------------------- */

                            case "home":

                                showMessage(
                                    "Ya estás en el menú principal."
                                );

                                break;



                            /* -------------------------
                               CERRAR
                            -------------------------- */

                            case "close":

                                showMessage(
                                    "Cerrar menú"
                                );

                                break;



                            /* -------------------------
                               CERRAR MODAL
                            -------------------------- */

                            case "modal-close":

                                closeModal();

                                break;

                        }

                    }
                );

            });



        /* =========================================
           CERRAR MODAL HACIENDO CLICK AFUERA
        ========================================== */

        modalLayer.addEventListener(
            "click",
            event => {

                if (
                    event.target === modalLayer
                ) {

                    closeModal();

                }

            }
        );



        /* =========================================
           CERRAR CON ESCAPE
        ========================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );

    </script>

</body>

</html>
