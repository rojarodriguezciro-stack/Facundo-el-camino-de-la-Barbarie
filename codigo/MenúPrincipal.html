<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101015">
  <title>FACUNDO: CAMINO DE LA BARBARIE</title>
  <style>
    :root { color-scheme: dark; background: #101015; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #101015; }
    #app-shell { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #101015; }
    #game-frame { display: block; width: 100%; height: 100%; border: 0; background: #101015; }
    #app-shell:fullscreen { width: 100vw; height: 100vh; background: #101015; }
    #app-shell:fullscreen #game-frame { width: 100vw; height: 100vh; }
    #app-shell:-webkit-full-screen { width: 100vw; height: 100vh; background: #101015; }
    #app-shell:-webkit-full-screen #game-frame { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <main id="app-shell" aria-label="Facundo: Camino de la Barbarie">
    <iframe
      id="game-frame"
      src="Men%C3%BAPrincipal-contenido.html"
      title="Juego Facundo: Camino de la Barbarie"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </main>
  <script>
    (() => {
      'use strict';
      const shell = document.getElementById('app-shell');

      async function enterFullscreen() {
        if (document.fullscreenElement) return true;
        if (!shell.requestFullscreen) return false;
        await shell.requestFullscreen();
        return true;
      }

      async function exitFullscreen() {
        if (!document.fullscreenElement) return true;
        if (!document.exitFullscreen) return false;
        await document.exitFullscreen();
        return true;
      }

      async function toggleFullscreen() {
        return document.fullscreenElement ? exitFullscreen() : enterFullscreen();
      }

      // Los documentos de cada capítulo viven dentro del mismo iframe. El contenedor
      // de este documento permanece en pantalla completa aunque cambie la escena.
      window.FacundoShell = Object.freeze({
        isFullscreen: () => Boolean(document.fullscreenElement),
        enterFullscreen,
        exitFullscreen,
        toggleFullscreen
      });

      document.addEventListener('fullscreenchange', () => {
        document.documentElement.classList.toggle('is-fullscreen', Boolean(document.fullscreenElement));
      });

      // F11 lo gestiona principalmente el navegador; cuando el evento llega a la página,
      // también salimos del modo de pantalla completa del juego.
      document.addEventListener('keydown', event => {
        if (event.key === 'F11' && document.fullscreenElement) {
          exitFullscreen().catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
