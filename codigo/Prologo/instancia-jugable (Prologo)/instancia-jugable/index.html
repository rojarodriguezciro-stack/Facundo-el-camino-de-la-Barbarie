<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facundo — Civilización o Barbarie</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Fuente Dislexia Opcional via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic.css" />
</head>
<body class="font-serif">

  <div id="stage" class="stage">
    <!-- Capas de fondo para transición fluida -->
    <div id="bgA" class="bg-layer active"></div>
    <div id="bgB" class="bg-layer"></div>

    <!-- Header superior: HUD y Controles -->
    <header class="top-bar">
      <div id="hud" class="hud">
        <span class="hud-label civil">Civilización</span>
        <div class="compass-bar">
          <div id="compassCivil" class="compass-fill civil"></div>
          <div id="compassBarbarie" class="compass-fill barbarie"></div>
        </div>
        <span class="hud-label barbarie">Barbarie</span>
      </div>

      <div class="top-controls">
        <button id="btnHistory" type="button" class="ui-btn-icon" aria-label="Abrir historial">Historial</button>
        <button id="btnSettings" type="button" class="ui-btn-icon" aria-label="Abrir ajustes">Ajustes</button>
      </div>
    </header>

    <!-- Retrato de personaje -->
    <img id="portrait" class="portrait" src="" alt="Personaje" />

    <!-- Caja de Diálogo -->
    <div id="dialogueBox" class="dialogue-box">
      <div id="timerWrap" class="timer-wrap">
        <div id="fuseFill" class="fuse-fill"></div>
        <span id="timerNum" class="timer-num"></span>
      </div>

      <div id="nameplate" class="nameplate"></div>
      <p id="promptText" class="prompt-text"></p>

      <div id="dialogueText" class="dialogue-text text-md"></div>

      <div id="choices" class="choices-container"></div>

      <div id="continueRow" class="continue-row">
        <button id="continueBtn" type="button" class="continue-btn">
          Continuar <span class="click-indicator">▼</span>
        </button>
      </div>
    </div>

    <!-- Pantalla Inicial -->
    <div id="startScreen" class="overlay-screen active">
      <div class="start-card">
        <h1>FACUNDO</h1>
        <h2>Civilización o Barbarie</h2>
        <p class="subtitle">Una experiencia narrativa interactiva</p>
        <button id="startBtn" type="button" class="big-btn">Comenzar Historia</button>
      </div>
    </div>

    <!-- Modal Historial -->
    <div id="modalHistory" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-content history-modal-content">
        <div class="modal-header">
          <h3>Historial de Diálogos</h3>
          <button id="closeHistory" type="button" class="close-btn" aria-label="Cerrar">&times;</button>
        </div>
        <div id="historyLog" class="history-log"></div>
      </div>
    </div>

    <!-- Modal Ajustes -->
    <div id="modalSettings" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-content settings-modal-content">
        <div class="modal-header">
          <h3>Ajustes del Juego</h3>
          <button id="closeSettings" type="button" class="close-btn" aria-label="Cerrar">&times;</button>
        </div>
        
        <div class="settings-grid">
          <fieldset class="settings-group">
            <legend>1. Texto y Lectura</legend>
            <label class="setting-item">
              <span>Velocidad de texto:</span>
              <input type="range" id="sliderSpeed" min="5" max="60" step="1" value="25" />
            </label>
          </fieldset>

          <fieldset class="settings-group">
            <legend>2. Tipografía y Estilo Visual</legend>
            <label class="setting-item">
              <span>Tipo de Fuente:</span>
              <select id="selectFontFamily">
                <option value="serif" selected>Clásica (Serif)</option>
                <option value="sans">Estándar (Sans-serif)</option>
                <option value="dyslexic">OpenDyslexic</option>
              </select>
            </label>

            <label class="setting-item">
              <span>Tamaño de letra:</span>
              <select id="selectTextSize">
                <option value="text-sm">Pequeña</option>
                <option value="text-md" selected>Mediana</option>
                <option value="text-lg">Grande</option>
              </select>
            </label>
          </fieldset>

          <fieldset class="settings-group">
            <legend>3. Gráficos y Pantalla</legend>
            <label class="setting-item">
              <span>Modo de Pantalla:</span>
              <button id="btnToggleFullscreen" type="button" class="small-btn">Alternar Pantalla Completa</button>
            </label>
          </fieldset>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
