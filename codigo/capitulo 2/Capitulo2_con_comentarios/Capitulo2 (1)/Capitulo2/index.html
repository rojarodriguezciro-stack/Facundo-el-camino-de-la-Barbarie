<!DOCTYPE html>
<html lang="es">
<head>
<!-- Configuración básica de la página y conexión con la hoja de estilos. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facundo — Capítulo Dos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Contenedor principal de la novela visual. -->

<div class="game-shell">
  <!-- Encabezado con el nombre y el capítulo actual. -->
  <header class="game-header">
    <h1 class="game-title">Facundo</h1>
    <p class="game-subtitle">Capítulo Dos — El camino elegido</p>
  </header>

  <!-- Marco visual que contiene toda la escena del juego. -->
  <div class="stage-frame">
    <!-- Escenario dinámico: JavaScript cambia fondos, personajes y diálogos según el avance. -->
    <div class="stage" id="stage" aria-live="polite">
      <div class="stage-bg" id="bgA"></div>
      <div class="stage-bg" id="bgB"></div>
      <div class="vignette"></div>

      <img id="portrait" class="portrait portrait-left" alt="" />

      <!-- HUD: muestra los valores que se modifican según las decisiones del jugador. -->
      <div class="hud show" id="hud">
        <span class="hud-label">Civilización: <span id="valCiv">0</span></span>
        <span class="hud-label" style="color: var(--gold);">Quiroga: <span id="valQui">0</span></span>
        <span class="hud-label" style="color: var(--civil-bright);">Investigación: <span id="valInv">0</span></span>
      </div>

      <!-- Caja reutilizable para mostrar narración, personajes y opciones. -->
      <div class="dialogue-box" id="dialogueBox">
        <span class="nameplate" id="nameplate"></span>
        <p class="prompt-text" id="promptText" style="display:none;"></p>
        <p class="dialogue-text" id="dialogueText"></p>
        <div class="choices" id="choices" style="display:none;"></div>
        <div class="continue-row" id="continueRow">
          <button class="continue-btn" id="continueBtn" type="button">Continuar ▸</button>
        </div>
      </div>

      <!-- Pantalla inicial del capítulo; se elimina al comenzar la partida. -->
      <div class="overlay-screen" id="startScreen">
        <h2 class="overlay-title">Capítulo Dos</h2>
        <p class="overlay-sub">El camino que elegiste en la pampa te trajo hasta acá. Ya no hay vuelta atrás.</p>
        <button class="big-btn" id="startBtn" type="button">Comenzar Capítulo</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
